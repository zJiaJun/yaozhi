<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遥指 Yaozhi · A1 墨指的头尾互换</title>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!--
  A1"墨指"保持黑白，比较把圆润的指尖和收细的主体互换之后的几种构图。
  每个都有浅色和深色版本（macOS 26 在深色模式下换用深色图标）。
-->
<style>
:root{
  --bg:#f4f3f0; --card:#fff; --ink:#16171b; --muted:#6c6c72; --line:rgba(0,0,0,.08); --accent:#5b8cff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
header{max-width:1200px;margin:0 auto;padding:40px 28px 6px}
h1{margin:0 0 8px;font-size:30px;letter-spacing:-.4px}
header p{margin:0;color:var(--muted);line-height:1.65;max-width:880px}
.docks{max-width:1200px;margin:22px auto 0;padding:0 28px;display:grid;gap:12px}
.dock{border-radius:22px;padding:16px;display:flex;justify-content:center}
.dock.light{background:linear-gradient(135deg,#dfe6ff,#f6e6ee 60%,#f3ece2)}
.dock.dark{background:linear-gradient(135deg,#25304f,#3b2f45 60%,#4a3a3d)}
.shelf{display:flex;gap:10px;padding:8px 12px;border-radius:20px;background:rgba(255,255,255,.4);backdrop-filter:blur(10px);flex-wrap:wrap;justify-content:center}
.dock.dark .shelf{background:rgba(255,255,255,.12)}
.shelf .app{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#3c3c42}
.dock.dark .shelf .app{color:#d8d8de}
.shelf svg{width:60px;height:60px;filter:drop-shadow(0 6px 10px rgba(20,25,45,.25))}
main{max-width:1200px;margin:0 auto;padding:22px 28px 60px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.v{background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:0 14px 40px rgba(40,45,70,.07);overflow:hidden;display:flex;flex-direction:column}
.v.rec{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.v .art{display:grid;grid-template-columns:1fr 1fr;}
.v .art div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px 10px}
.v .art .l{background:radial-gradient(70% 70% at 50% 40%,#fff,#ecebe7)}
.v .art .d{background:radial-gradient(70% 70% at 50% 40%,#3a3b42,#1c1d22)}
.v .art svg.big{width:150px;height:150px;filter:drop-shadow(0 16px 22px rgba(20,25,45,.28))}
.v .art .s{display:flex;flex-direction:row;gap:10px;align-items:flex-end;padding:0}
.v .art .s span{display:block}
.v .art .s svg{display:block}
.v .info{padding:16px 20px 18px;display:flex;flex-direction:column;gap:8px}
.v .info .t{display:flex;align-items:baseline;gap:10px}
.v .info h2{margin:0;font-size:18px}
.v .info .tag{font-size:11px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px}
.v .info p{margin:0;color:#3c3c42;line-height:1.6;font-size:13px}
.v .info .sw{display:flex;gap:6px;margin-top:2px}
.v .info .sw i{width:22px;height:22px;border-radius:7px;display:block;border:1px solid var(--line)}
footer{max-width:1200px;margin:0 auto;padding:0 28px 50px;color:var(--muted);line-height:1.7;font-size:13px}
@media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>A1 墨指：指尖和主体互换</h1>
  <p>保持黑白。原稿是左下圆润的指尖一路收细，指向右上的目标圆点。"互换"有几种理解，都做出来比一比：<b>头尾反向</b>（圆头到右上、细尾拖在左下）、<b>大小互换</b>（目标变成大圆主体，指尖变小）、<b>底图互换</b>（黑底白图）。第一个是原稿，作对照。</p>
</header>
<section class="docks">
  <div class="dock light"><div class="shelf" id="dockLight"></div></div>
  <div class="dock dark"><div class="shelf" id="dockDark"></div></div>
</section>
<main id="main"></main>
<footer>
  说明：16 px 那个小图就接近菜单栏图标的大小，菜单栏用的是同一个图形的单色模板图，由系统着色。定稿后用 Icon Composer 做成分层的 .icon。
</footer>

<script>
const SQ = 'M285,100 H739 C866,100 924,158 924,285 V739 C924,866 866,924 739,924 H285 C158,924 100,866 100,739 V285 C100,158 158,100 285,100 Z';
let uid = 0;
function teardrop(cx, cy, r, tx, ty, tr) {
  const dx = tx - cx, dy = ty - cy, d = Math.hypot(dx, dy);
  const a = Math.atan2(dy, dx), b = Math.acos((r - tr) / d);
  const p = (x, y, rr, t) => [x + rr * Math.cos(t), y + rr * Math.sin(t)];
  const [h1x, h1y] = p(cx, cy, r, a + b), [t1x, t1y] = p(tx, ty, tr, a + b);
  const [t2x, t2y] = p(tx, ty, tr, a - b), [h2x, h2y] = p(cx, cy, r, a - b);
  const f = v => v.toFixed(2);
  return `M${f(h1x)},${f(h1y)} L${f(t1x)},${f(t1y)} A${tr},${tr} 0 0 0 ${f(t2x)},${f(t2y)} L${f(h2x)},${f(h2y)} A${r},${r} 0 1 0 ${f(h1x)},${f(h1y)} Z`;
}
const circle = (x, y, r) => `M${x - r},${y} a${r},${r} 0 1 0 ${2 * r},0 a${r},${r} 0 1 0 ${-2 * r},0 Z`;

// Black and white only. LIGHT: white plate, ink figure; DARK: graphite plate, white figure.
const LIGHT = { plate: ['#ffffff', '#eceef3'], ink: '#121216', sheen: .5, edge: '#000' };
const DARK = { plate: ['#2a2b31', '#0f1013'], ink: '#f4f4f6', sheen: .12, edge: '#fff' };
const INVERT = { plate: ['#26272d', '#0c0d10'], ink: '#ffffff', sheen: .16, edge: '#000' };

function icon(shapes, c) {
  const g = 'g' + (++uid);
  return `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><defs>
    <linearGradient id="${g}p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.plate[0]}"/><stop offset="1" stop-color="${c.plate[1]}"/></linearGradient>
    <linearGradient id="${g}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${c.sheen}"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
    <path d="${SQ}" fill="url(#${g}p)"/>
    <path d="${SQ}" fill="url(#${g}h)"/>
    <path d="${SQ}" fill="none" stroke="${c.edge}" stroke-opacity=".07" stroke-width="4"/>
    ${shapes.map(d => `<path d="${d}" fill="${c.ink}"/>`).join('')}
  </svg>`;
}

const A1 = [teardrop(362, 662, 132, 654, 370, 26), circle(728, 296, 58)];
const V = [
  { name: 'A1 原稿', kind: '对照', shapes: A1,
    note: '左下圆润的指尖一路收细，指向右上；前方隔一点空隙是目标圆点。重心在左下，读起来是"从手里指出去"。' },
  { name: '反向·彗星', kind: '头尾反向', rec: true,
    shapes: [teardrop(566, 458, 128, 266, 758, 24), circle(740, 284, 42)],
    note: '圆头移到右上，细尾拖在左下，像一道划过去的轨迹，前方仍有一个小一些的目标圆点。动势更强，读起来是"飞向目标"，重心在右上，比原稿更有速度感。' },
  { name: '反向·光点', kind: '头尾反向',
    shapes: [teardrop(596, 428, 150, 296, 728, 24)],
    note: '去掉单独的目标圆点，圆头本身就是"指中"的那个点，细尾是指过去的轨迹。只有一个形状，最简洁，小尺寸最清楚；但像一颗流星或一滴水，"遥控"的意思弱一些。' },
  { name: '大小互换', kind: '大小互换',
    shapes: [circle(622, 402, 190), teardrop(282, 742, 70, 412, 612, 14)],
    note: '目标变成右上的大圆，成为主体；指尖缩小放在左下，像从角落指向它。大圆在 Dock 里很稳，有点像按键或光斑；但主次反过来以后，"指"这个动作变成了配角。' },
  { name: '黑底白图', kind: '底图互换', shapes: A1, invert: true,
    note: '形状和原稿一样，只是浅色模式也用黑底、白色图形（深色模式本来就是这样）。在浅色 Dock 里比白底更醒目，气质接近 Raycast、终端。' },
];

const icons = V.map(v => ({ ...v, L: icon(v.shapes, v.invert ? INVERT : LIGHT), D: icon(v.shapes, DARK) }));
document.getElementById('dockLight').innerHTML = icons.map(v => `<div class="app">${v.L}<span>${v.name}</span></div>`).join('');
document.getElementById('dockDark').innerHTML = icons.map(v => `<div class="app">${v.D}<span>${v.name}</span></div>`).join('');

const main = document.getElementById('main');
for (const v of icons) {
  const el = document.createElement('section');
  el.className = 'v' + (v.rec ? ' rec' : '');
  const small = svg => [32, 16].map(n => `<span style="width:${n}px;height:${n}px">${svg.replace('<svg ', `<svg width="${n}" height="${n}" `)}</span>`).join('');
  el.innerHTML = `
    <div class="art">
      <div class="l">${v.L.replace('<svg ', '<svg class="big" ')}<div class="s">${small(v.L)}</div></div>
      <div class="d">${v.D.replace('<svg ', '<svg class="big" ')}<div class="s">${small(v.D)}</div></div>
    </div>
    <div class="info">
      <div class="t"><h2>${v.name}</h2>${v.rec ? '<span class="tag">推荐</span>' : ''}<span style="font-size:12px;color:var(--muted)">${v.kind}</span></div>
      <p>${v.note}</p>
    </div>`;
  main.appendChild(el);
}
</script>
</body>
</html>
