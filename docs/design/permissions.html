<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遥指 Yaozhi · 权限与准备情况</title>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<!--
  权限状态原型，沿用版本一（舞台）的视觉。演示：
  - 主窗口右侧"准备情况"清单，每项一行，五种权限状态：未允许 / 等待中 / 已允许 / 已被关闭 / 没有生效（旧条目）
  - 底部状态岛、菜单栏图标和菜单栏面板跟着状态变
  - 点"去授权"：系统设置（示意）打开到辅助功能，下面贴 MyGo 的面板（英文、固定文案），把 Yaozhi 拖进列表；
    授权后面板直接关闭，成功反馈和中文提示都由遥指自己的状态岛给出
  - 系统自己的弹窗和身份验证只画成虚线示意框，不模仿系统界面（Apple HIG）
  拖拽面板在 App 里由 MyGo 的 plugins/permissionflow 实现。
-->
<style>
:root{
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.32,.64,1);
  --accent:#5b8cff; --accent2:#a46bff; --accent3:#29d3ff;
  --voice:#ff6b6b; --ok:#3ddc84; --warn:#ffb340; --bad:#ff5d5d; --stale:#f5d042;
  --text:#f5f6f8; --muted:rgba(245,246,248,.62); --faint:rgba(245,246,248,.38);
  --glass:rgba(255,255,255,.075); --glass-hi:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.14);
  --stage:#07080c; --aur1:rgba(76,96,255,.42); --aur2:rgba(150,80,255,.32); --aur3:rgba(0,190,255,.22);
  --shadow:rgba(0,0,0,.65);
  --sys-bg:#1e1f23; --sys-side:#2a2b30; --sys-line:rgba(255,255,255,.08); --sys-row:#26272c; --sys-text:#e9e9ec; --sys-muted:#9a9ba2;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
}
body.light{
  --text:#16171b; --muted:rgba(22,23,27,.6); --faint:rgba(22,23,27,.36);
  --glass:rgba(255,255,255,.55); --glass-hi:rgba(255,255,255,.85); --glass-line:rgba(255,255,255,.9);
  --stage:#eef0f4; --aur1:rgba(120,150,255,.28); --aur2:rgba(190,140,255,.22); --aur3:rgba(110,220,255,.22);
  --shadow:rgba(40,45,70,.35);
  --ok:#1fa75a; --warn:#e08a00; --bad:#e23b3b; --stale:#c9a100;
  --sys-bg:#f3f3f5; --sys-side:#e6e6ea; --sys-line:rgba(0,0,0,.08); --sys-row:#ffffff; --sys-text:#1d1d1f; --sys-muted:#86868b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--text);-webkit-font-smoothing:antialiased;font-size:13px;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}

/* ---------- desktop & menu bar ---------- */
.desktop{position:fixed;inset:0;background:
  radial-gradient(1200px 700px at 15% 10%,#5a6fb0 0%,transparent 60%),
  radial-gradient(900px 700px at 90% 90%,#a7748f 0%,transparent 60%),
  radial-gradient(800px 600px at 80% 10%,#6c8fa8 0%,transparent 55%),
  linear-gradient(160deg,#2b3350,#3b2f45 55%,#4a3a3d)}
body.light .desktop{background:
  radial-gradient(1200px 700px at 15% 10%,#c9d6ff 0%,transparent 60%),
  radial-gradient(900px 700px at 90% 90%,#ffd9e3 0%,transparent 60%),
  linear-gradient(160deg,#e9edf8,#f4ecf3 55%,#f6efe8)}
.menubar{position:absolute;top:0;left:0;right:0;height:28px;display:flex;align-items:center;gap:18px;padding:0 14px;
  background:rgba(20,22,30,.18);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  color:#fff;font-size:13px;z-index:60}
body.light .menubar{color:#111;background:rgba(255,255,255,.25)}
.menubar b{font-weight:600}
.menubar .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.tray{width:30px;height:22px;border-radius:6px;display:grid;place-items:center;position:relative}
.tray.open{background:rgba(255,255,255,.22)} body.light .tray.open{background:rgba(0,0,0,.1)}
.tray svg{width:16px;height:16px}
.tray .badge{position:absolute;right:4px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--warn);
  box-shadow:0 0 0 1.5px rgba(30,30,40,.6);transform:scale(0);transition:transform .35s var(--spring),background .3s}
body.light .tray .badge{box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.tray[data-tone="warn"] .badge{transform:scale(1)}
.tray[data-tone="bad"] .badge{transform:scale(1);background:var(--bad)}

/* ---------- menu bar flyout ---------- */
.flyout{position:absolute;top:34px;right:96px;width:300px;border-radius:16px;padding:12px;z-index:70;
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;
  transition:opacity .25s var(--ease),transform .35s var(--spring);background:rgba(30,32,40,.62)}
body.light .flyout{background:rgba(255,255,255,.66)}
.flyout.open{opacity:1;transform:none;pointer-events:auto}
.fy-head{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.fy-head .st{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.fy-head .st[data-tone="warn"]{background:var(--warn)} .fy-head .st[data-tone="bad"]{background:var(--bad)}
.fy-head .st[data-tone="wait"]{background:var(--accent)}
.fy-head b{display:block;font-size:13px}
.fy-head span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.fy-issue{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--glass);margin-bottom:6px}
.fy-issue .d{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.fy-issue .d.bad{background:var(--bad)}
.fy-issue .t{flex:1;line-height:1.35}
.fy-foot{display:flex;gap:8px;margin-top:6px}
.fy-foot button{flex:1;padding:8px;border-radius:9px;background:var(--glass-hi);font-weight:500}

/* ---------- notification (system, schematic) ---------- */
.notif{position:absolute;top:40px;right:14px;width:340px;border-radius:16px;padding:12px 14px;display:flex;gap:12px;z-index:65;
  transform:translateX(380px);opacity:0;visibility:hidden;cursor:pointer;background:rgba(40,42,52,.6);
  transition:transform .6s var(--spring),opacity .4s,visibility 0s .6s}
body.light .notif{background:rgba(255,255,255,.72)}
.notif.show{transform:none;opacity:1;visibility:visible;transition:transform .6s var(--spring),opacity .3s}
.notif .ai{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#5b8cff,#a46bff);color:#fff}
.notif .ai svg{width:20px;height:20px}
.notif b{display:block;margin-bottom:2px}
.notif span{color:var(--muted);line-height:1.4}
.notif small{position:absolute;right:12px;top:10px;color:var(--faint);font-size:11px}

/* ---------- main window ---------- */
.win{position:absolute;left:50%;top:calc(50% - 6px);width:min(1060px,calc(100vw - 80px));height:min(660px,calc(100vh - 150px));
  transform:translate(-50%,-50%);border-radius:22px;overflow:hidden;background:var(--stage);z-index:20;
  box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08) inset,0 0 0 .5px rgba(0,0,0,.6);
  transition:transform .7s var(--ease),filter .5s,opacity .5s}
body.light .win{box-shadow:0 40px 120px rgba(60,70,110,.35),0 0 0 1px rgba(255,255,255,.9) inset}
.win.aside{transform:translate(calc(-50% - var(--shift,0px)),-50%) scale(.9);filter:saturate(.85) brightness(.92);z-index:10}
.aurora{position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 30% 30%,var(--aur1),transparent 70%),
  radial-gradient(35% 40% at 75% 60%,var(--aur2),transparent 70%),
  radial-gradient(30% 30% at 55% 85%,var(--aur3),transparent 70%);
  filter:blur(30px);animation:drift 22s ease-in-out infinite alternate;opacity:.9}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(6deg)}100%{transform:translate(-2%,3%) rotate(-4deg)}}
.win.paused .aurora{filter:blur(30px) saturate(.35)}
.grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.6) .5px,transparent .6px);background-size:3px 3px;pointer-events:none}
body.light .grain{opacity:.08;background-image:radial-gradient(rgba(0,0,0,.4) .5px,transparent .6px)}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);
  border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 34px rgba(0,0,0,.28)}
body.light .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 34px rgba(70,80,120,.14)}
.lights{position:absolute;left:18px;top:18px;display:flex;gap:8px;z-index:10}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.wtitle{position:absolute;left:86px;top:14px;z-index:10;font-weight:600;font-size:13px;color:var(--muted)}

/* remote */
.hero{position:absolute;left:24%;top:50%;width:var(--hw,150px);transform:translate(-50%,-50%);z-index:3}
.float{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
.floor{position:absolute;left:50%;bottom:-30px;width:70%;height:34px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,var(--shadow),transparent);filter:blur(6px)}
.hero svg{width:100%;overflow:visible}
.rings circle{fill:none;stroke:var(--voice);stroke-width:1.4;transform-box:fill-box;transform-origin:center;opacity:0}
.win.listening .rings circle{animation:ring 1.8s cubic-bezier(.2,.7,.3,1) infinite}
.win.listening .rings circle:nth-child(2){animation-delay:.6s}.win.listening .rings circle:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(4.2);opacity:0}}
#k-voice{transition:filter .3s}
.win.listening #k-voice{fill:url(#k-voiceg);stroke:#b3262b;filter:drop-shadow(0 0 10px rgba(255,107,107,.9))}
.ready-dot{fill:var(--voice);opacity:.9;animation:breathe 3.2s ease-in-out infinite;transition:fill .3s}
.win.blocked .ready-dot{fill:var(--warn)} .win.paused .ready-dot{fill:var(--bad)}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.95}}
.k,.kw{pointer-events:none}.kw{fill:transparent}

/* ---------- checklist ---------- */
.check{position:absolute;right:28px;top:56px;bottom:96px;width:min(470px,52%);border-radius:20px;padding:18px 18px 10px;z-index:4;
  display:flex;flex-direction:column;overflow:hidden}
.ck-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ck-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:.2px}
.ck-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.prog{width:42px;height:42px;flex:none;position:relative}
.prog svg{width:42px;height:42px;transform:rotate(-90deg)}
.prog circle{fill:none;stroke-width:3.5}
.prog .bg{stroke:var(--glass-hi)}
.prog .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease),stroke .3s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.ck-body{overflow:auto;margin:0 -6px;padding:0 6px}
.grp{margin-top:10px}
.grp h3{margin:0 0 6px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.6px}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:10px 10px;border-radius:13px;margin-bottom:4px;
  position:relative;transition:background .4s,transform .5s var(--spring),opacity .5s;opacity:0;transform:translateY(8px)}
.row.in{opacity:1;transform:none}
.row:hover{background:var(--glass)}
.row[data-tone="warn"],.row[data-tone="bad"],.row[data-tone="stale"],.row[data-tone="wait"]{background:var(--glass)}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass-hi);position:relative}
.row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .ic .dot{position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--stage);transform:scale(0);transition:transform .35s var(--spring)}
.row[data-tone="warn"] .ic .dot{transform:scale(1);background:var(--warn)}
.row[data-tone="bad"] .ic .dot{transform:scale(1);background:var(--bad)}
.row[data-tone="stale"] .ic .dot{transform:scale(1);background:var(--stale)}
.row > div:nth-child(2){min-width:0}
.row .tt{font-weight:600;display:flex;align-items:center;gap:8px}
.row .lab{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--glass-hi);color:var(--muted)}
.row[data-tone="ok"] .lab{color:var(--ok);background:rgba(61,220,132,.14)}
.row[data-tone="warn"] .lab{color:var(--warn);background:rgba(255,179,64,.16)}
.row[data-tone="bad"] .lab{color:var(--bad);background:rgba(255,93,93,.16)}
.row[data-tone="stale"] .lab{color:var(--stale);background:rgba(245,208,66,.16)}
.row[data-tone="wait"] .lab{color:var(--accent);background:rgba(91,140,255,.16)}
.row .sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.row .act{display:flex;align-items:center;gap:8px}
.btn{padding:7px 13px;border-radius:9px;font-weight:600;font-size:12.5px;white-space:nowrap;transition:transform .2s var(--spring),filter .2s}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(180deg,#6c97ff,#4a78f0);color:#fff;box-shadow:0 4px 14px rgba(74,120,240,.4)}
.btn.danger{background:linear-gradient(180deg,#ff7070,#e84848);color:#fff;box-shadow:0 4px 14px rgba(232,72,72,.35)}
.btn.ghost{background:var(--glass-hi)}
.okmark{width:20px;height:20px;color:var(--ok)}
.okmark path{stroke-dasharray:24;stroke-dashoffset:0}
.row.fresh .okmark path{stroke-dashoffset:24;animation:draw .55s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(91,140,255,.25);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row .flash{position:absolute;inset:0;border-radius:13px;pointer-events:none;opacity:0;background:radial-gradient(60% 120% at 10% 50%,rgba(61,220,132,.35),transparent 70%)}
.row.fresh .flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

/* ---------- status island ---------- */
.island{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;height:50px;border-radius:999px;
  display:flex;align-items:center;padding:0 8px 0 16px;gap:10px;white-space:nowrap;
  transition:width .55s var(--spring),background .4s,box-shadow .4s;overflow:hidden}
.island .lead{width:22px;height:22px;display:grid;place-items:center;flex:none}
.island .lead i{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 2.4s infinite}
.island .lead i.spin{width:16px;height:16px;background:none;box-shadow:none;border-radius:50%;border:2px solid rgba(91,140,255,.25);border-top-color:var(--accent);animation:spin .8s linear infinite}
.island[data-tone="warn"] .lead i{background:var(--warn);animation:none}
.island[data-tone="bad"] .lead i{background:var(--bad);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 7px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.island .lead svg{width:20px;height:20px;color:var(--ok)}
.island .lead svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .1s var(--ease) forwards}
.island .txt{font-weight:550}
.island .txt small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12.5px}
.island .ia{margin-left:4px}
.island .ia:empty{display:none}
.island .ia .btn{border-radius:999px;padding:8px 14px}
.island[data-tone="bad"]{background:rgba(255,93,93,.14)}
.island.pop{animation:pop .6s var(--spring)}
@keyframes pop{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(1)}}
.island .wave{display:flex;gap:2px;align-items:center;height:20px}
.island .wave i{width:3px;border-radius:2px;background:var(--voice);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:4px}50%{height:18px}}

/* ---------- System Settings (schematic) ---------- */
.sys{position:absolute;width:560px;height:430px;border-radius:14px;background:var(--sys-bg);color:var(--sys-text);z-index:30;
  box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.5);display:flex;overflow:hidden;
  opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;transition:opacity .4s var(--ease),transform .55s var(--spring)}
body.light .sys{box-shadow:0 30px 90px rgba(60,70,110,.35),0 0 0 .5px rgba(0,0,0,.18)}
.sys.open{opacity:1;transform:none;pointer-events:auto}
.sys .side{width:170px;background:var(--sys-side);padding:44px 10px 10px;flex:none}
.sys .side .lights{position:absolute;left:14px;top:14px}
.sys .side i.bar{display:block;height:9px;border-radius:5px;background:var(--sys-line);margin:12px 8px}
.sys .side .cur{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;margin:10px 0}
.sys .side .cur s{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.3);display:block;text-decoration:none}
.sys .main{flex:1;padding:16px 20px;display:flex;flex-direction:column;min-width:0}
.sys .nav{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;margin-bottom:12px}
.sys .nav span{color:var(--sys-muted);font-weight:400}
.sys .desc{color:var(--sys-muted);font-size:12px;margin-bottom:12px;line-height:1.45}
.sys .list{border-radius:10px;background:var(--sys-row);border:1px solid var(--sys-line);position:relative;transition:box-shadow .25s,border-color .25s}
.sys .list.hot{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.35)}
.sys .app{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--sys-line);transition:background .2s}
.sys .app.sel{background:rgba(91,140,255,.18)}
.sys .app .ai{width:22px;height:22px;border-radius:6px;flex:none}
.sys .app .nm{flex:1}
.sys .app.new{animation:rowin .5s var(--spring)}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}}
.sys .app.gone{animation:rowout .35s var(--ease) forwards}
@keyframes rowout{to{opacity:0;height:0;padding-top:0;padding-bottom:0}}
.tog{width:32px;height:19px;border-radius:999px;background:rgba(127,127,135,.4);position:relative;transition:background .25s;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .3s var(--spring)}
.tog.on{background:#34c759}.tog.on::after{transform:translateX(13px)}
.sys .pm{display:flex;padding:5px 6px;gap:2px}
.sys .pm button{width:24px;height:20px;border-radius:5px;color:var(--sys-muted);font-size:15px;line-height:20px}
.sys .pm button:hover{background:var(--sys-line);color:var(--sys-text)}
.sys .pm button.hint{color:var(--accent);background:rgba(91,140,255,.15);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{background:rgba(91,140,255,.32)}}
.sys .caption{position:absolute;left:12px;bottom:-24px;font-size:11px;color:var(--faint)}

/* placeholders for the system's own UI */
.ph{position:absolute;border:1.5px dashed rgba(255,255,255,.55);border-radius:14px;background:rgba(20,22,30,.55);color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 16px;z-index:45;width:290px;font-size:12.5px;line-height:1.5;
  opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .25s,transform .35s var(--spring)}
body.light .ph{border-color:rgba(0,0,0,.35);background:rgba(255,255,255,.75);color:#111}
.ph.open{opacity:1;transform:none;pointer-events:auto}
.ph em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.6px;color:var(--faint);margin-bottom:6px}

/* ---------- drag guide panel: as MyGo plugins/permissionflow draws it ---------- */

   System Settings' sidebar. English text, fixed. No success state: it closes on grant. */
.guide{position:absolute;z-index:40;border-radius:12px;padding:12px 14px 14px;color:var(--sys-text);
  background:rgba(44,45,52,.86);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);

.guide.open{opacity:1;transform:none;pointer-events:auto}
.guide .x{position:absolute;right:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--sys-muted);color:var(--sys-bg);

.appicon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;

/* ---------- legend ---------- */

.legend a{color:var(--accent3)} body.light .legend a{color:#3a5bd9}

  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

<script src="rc003.js"></script>
<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- remote ---------- */
$('#remote').innerHTML = rc003SVG({ prefix: 'k-' });
function sizeHero() {
  const h = $('#win').clientHeight;
  $('#hero').style.setProperty('--hw', Math.min(h * 0.66 * 200 / 840, 150) + 'px');
}
sizeHero(); addEventListener('resize', () => { sizeHero(); placeSys(); });

/* ---------- icons ---------- */
const IC = {
  bt: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10-5 5V2l5 5L7 17"/></svg>',
  ax: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="7.3" r="1.3" fill="currentColor"/><path d="M7.5 10h9M12 10v4l-2.5 4.5M12 14l2.5 4.5"/></svg>',
  kb: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M10 10h.01M13 10h.01M16 10h.01M8 14h8"/></svg>',
  wave: '<svg viewBox="0 0 24 24"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>',
  mic: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
  type: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><path d="M18 14v7" /></svg>',
  check: '<svg class="okmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  remote: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="1.5" width="6" height="13" rx="2"/><circle cx="8" cy="5" r="1.2" fill="currentColor" stroke="none"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7.5a6.5 6.5 0 0 1-6.5 6.5h-.6a5 5 0 0 1-4.1-2.1L3.6 14a1.5 1.5 0 0 1 2.3-1.9L8 14"/></svg>',
};

/* ---------- state ---------- */
const ROWS = [
  { id: 'bt', g: 'perm', ic: IC.bt, t: '蓝牙', why: '连接遥控器、接收语音' },
  { id: 'ax', g: 'perm', ic: IC.ax, t: '辅助功能', why: '替你点 Fn，开始和结束 Typeless' },
  { id: 'vm', g: 'chain', ic: IC.wave, t: '虚拟麦克风', why: 'BlackHole 2ch，Typeless 从 yaozhi-mic 收音（遥指自动创建）' },
  { id: 'tl', g: 'chain', ic: IC.type, t: 'Typeless', why: '麦克风选 yaozhi-mic' },
];
const SCENES = {
  first:   { bt: 'missing', ax: 'missing', vm: 'ok', tl: 'unconfirmed' },
  needax:  { bt: 'granted', ax: 'missing', vm: 'ok', tl: 'ok' },
  ready:   { bt: 'granted', ax: 'granted', vm: 'ok', tl: 'ok' },
  revoked: { bt: 'granted', ax: 'revoked', vm: 'ok', tl: 'ok' },
  stale:   { bt: 'granted', ax: 'stale', vm: 'ok', tl: 'ok' },
};
let S = {}, scene = 'first', fresh = new Set(), flowBusy = false;

// What each (item, state) looks like. tone: ok / warn / bad / stale / wait / muted.
function view(id, st) {
  const why = ROWS.find(r => r.id === id).why;
  const V = {
    granted: { tone: 'ok', lab: '已允许', sub: why },
    ok: { tone: 'ok', lab: { vm: '已就绪', tl: '已出字' }[id], sub: why },
    later: { tone: 'muted', lab: '稍后', sub: '读取遥控器按键 · 设置按键映射时再开' },
    waiting: { tone: 'wait', lab: '等待中', sub: id === 'bt' ? '在系统弹窗里选择' : '在系统设置里允许遥指', act: [{ t: '取消', c: 'ghost', f: cancelFlow }] },
  };
  if (V[st]) return V[st];
  if (id === 'bt' && st === 'missing') return { tone: 'warn', lab: '未允许', sub: '没有它连不上遥控器', act: [{ t: '继续', c: 'primary', f: btFlow }] };
  if (id === 'bt' && st === 'denied') return { tone: 'bad', lab: '已拒绝', sub: '只能到系统设置里打开', act: [{ t: '去系统设置', c: 'primary', f: () => axFlow('toggle', 'bt') }] };
  if (id === 'ax' && st === 'missing') return { tone: 'warn', lab: '未允许', sub: '没有它，语音输入用不了', act: [{ t: '去授权', c: 'primary', f: () => axFlow('add') }] };
  if (id === 'ax' && st === 'revoked') return { tone: 'bad', lab: '已被关闭', sub: '之前允许过，语音输入已暂停', act: [{ t: '重新授权', c: 'danger', f: () => axFlow('toggle') }] };
  if (id === 'ax' && st === 'stale') return { tone: 'stale', lab: '没有生效', sub: '列表里的遥指是更新前的旧版本', act: [{ t: '修复', c: 'primary', f: () => axFlow('stale') }] };
  if (id === 'tl' && st === 'unconfirmed') return { tone: 'muted', lab: '待确认', sub: '在 Typeless 设置里把麦克风选为 yaozhi-mic', act: [{ t: '说一句试试', c: 'ghost', f: testFlow }] };
  if (id === 'tl' && st === 'testing') return { tone: 'wait', lab: '试说中', sub: '按住遥控器语音键说一句话' };
  return { tone: 'muted', lab: st, sub: why };
}

const blocking = () => ['bt', 'ax', 'vm'].filter(k => !['granted', 'ok'].includes(S[k]));
const done = () => ['bt', 'ax', 'vm', 'tl'].filter(k => ['granted', 'ok'].includes(S[k])).length;
function overall() {
  if (Object.values(S).some(v => v === 'waiting' || v === 'testing')) return 'wait';
  if (S.ax === 'revoked' || S.bt === 'denied') return 'bad';
  if (blocking().length || S.ax === 'stale') return 'warn';
  if (S.tl !== 'ok') return 'almost';
  return 'ok';
}

/* ---------- render ---------- */
let rendered = false;
function render() {
  for (const g of ['perm', 'chain']) {
    const box = $('#g-' + g);
    box.innerHTML = '';
    ROWS.filter(r => r.g === g).forEach((r, i) => {
      const v = view(r.id, S[r.id]);
      const el = document.createElement('div');
      el.className = 'row' + (rendered ? ' in' : '') + (fresh.has(r.id) ? ' fresh' : '');
      el.dataset.tone = v.tone;
      el.innerHTML = `<div class="ic">${r.ic}<i class="dot"></i></div>
        <div><div class="tt">${r.t}<span class="lab">${v.lab}</span></div><div class="sub">${v.sub}</div></div>
        <div class="act"></div><i class="flash"></i>`;
      const act = el.querySelector('.act');
      if (v.tone === 'ok') act.innerHTML = IC.check;
      if (v.tone === 'wait') act.innerHTML = '<i class="spin"></i>';
      (v.act || []).forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + a.c; b.textContent = a.t; b.onclick = a.f;
        act.appendChild(b);
      });
      box.appendChild(el);
      if (!rendered) setTimeout(() => el.classList.add('in'), reduce ? 0 : 80 + (g === 'chain' ? 3 : 0) * 70 + i * 70);
    });
  }
  rendered = true;
  fresh.clear();

  const n = done();
  $('#pnum').textContent = `${n}/4`;
  $('#pfg').style.strokeDashoffset = 106.8 * (1 - n / 4);
  const o = overall(), left = 4 - n;
  $('#summary').textContent = {
    ok: '一切就绪：按住遥控器语音键说话，松开出字',
    almost: '权限都好了，最后说一句话确认 Typeless 能出字',
    warn: S.ax === 'stale' ? '遥指更新后，辅助功能需要重新添加' : `还差 ${left} 步就能用遥控器说话`,
    bad: '语音输入已暂停：有权限被关闭了',
    wait: '正在等你完成授权…',
  }[o];

  const win = $('#win');
  win.classList.toggle('blocked', o === 'warn');
  win.classList.toggle('paused', o === 'bad');
  $('#tray').dataset.tone = o === 'bad' ? 'bad' : (o === 'warn' ? 'warn' : '');
  renderIsland(o);
  renderFlyout(o);
}

let islandLock = false;
function setIsland(tone, lead, txt, act) {
  const isl = $('#island');
  isl.dataset.tone = tone;
  $('#ilead').innerHTML = lead;
  $('#itxt').innerHTML = txt;
  const ia = $('#iact'); ia.innerHTML = '';
  if (act) { const b = document.createElement('button'); b.className = 'btn ' + act.c; b.textContent = act.t; b.onclick = act.f; ia.appendChild(b); }
}
function renderIsland(o) {
  if (islandLock) return;
  const first = ROWS.find(r => view(r.id, S[r.id]).act && ['warn', 'bad', 'stale'].includes(view(r.id, S[r.id]).tone));
  const firstAct = first && view(first.id, S[first.id]).act[0];
  if (o === 'ok') setIsland('ok', '<i></i>', '就绪<small>按住语音键说话，松开出字</small>');
  else if (o === 'almost') setIsland('ok', '<i></i>', '差最后一步<small>说一句话确认能出字</small>', { t: '说一句试试', c: 'ghost', f: testFlow });
  else if (o === 'wait') setIsland('wait', '<i class="spin"></i>', S.tl === 'testing' ? '按住遥控器语音键说一句…' : waitText());
  else if (o === 'bad') setIsland('bad', '<i></i>', '语音输入已暂停<small>辅助功能被关闭了</small>', firstAct);
  else setIsland('warn', '<i></i>', S.ax === 'stale' ? '辅助功能没有生效<small>更新后要重新添加</small>' : `还差 ${4 - done()} 步<small>${first ? '下一步：允许' + first.t : ''}</small>`, firstAct);
}
// What to do in System Settings, said in Yaozhi's own window: MyGo's panel is English and the same for every case.
function waitText() {
  if (!flow) return '在系统弹窗里选择…';
  if (flow.mode === 'stale') return '先删掉列表里旧的 Yaozhi<small>选中它，点下面的 −，再把新的拖进去</small>';
  if (flow.mode === 'toggle') return '打开列表里 Yaozhi 的开关<small>授权后自动继续</small>';
  return '把 Yaozhi 拖进上面的列表<small>或点 +，选择 Yaozhi.app</small>';
}
function islandSuccess(text) {
  islandLock = true;
  setIsland('ok', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>', text);
  const isl = $('#island'); isl.classList.remove('pop'); void isl.offsetWidth; isl.classList.add('pop');
  setTimeout(() => { islandLock = false; render(); }, 1800);
}

function renderFlyout(o) {
  const head = {
    ok: ['ok', '遥指就绪', '小米蓝牙遥控器 2 Pro · 已连接'],
    almost: ['ok', '遥指就绪', '还没确认 Typeless 能出字'],
    warn: ['warn', '还没准备好', '有几项需要处理'],
    bad: ['bad', '语音输入已暂停', '有权限被关闭了'],
    wait: ['wait', '正在授权', '在系统设置里完成'],
  }[o];
  const issues = ROWS.map(r => ({ r, v: view(r.id, S[r.id]) })).filter(x => ['warn', 'bad', 'stale'].includes(x.v.tone));
  $('#flyout').innerHTML = `<div class="fy-head"><i class="st" data-tone="${head[0]}"></i><div><b>${head[1]}</b><span>${head[2]}</span></div></div>
    ${issues.map(x => `<div class="fy-issue"><i class="d ${x.v.tone === 'bad' ? 'bad' : ''}"></i><div class="t">${x.r.t} · ${x.v.lab}<br><span style="color:var(--muted);font-size:12px">${x.v.sub}</span></div></div>`).join('')}
    <div class="fy-foot"><button id="fyopen">打开遥指</button>${issues[0] ? `<button id="fyfix" style="background:linear-gradient(180deg,#6c97ff,#4a78f0);color:#fff">${issues[0].v.act[0].t}</button>` : ''}</div>`;
  $('#fyopen').onclick = closeFlyout;
  if (issues[0]) $('#fyfix').onclick = () => { closeFlyout(); issues[0].v.act[0].f(); };
}
$('#tray').onclick = e => { e.stopPropagation(); const f = $('#flyout'); f.classList.toggle('open'); $('#tray').classList.toggle('open', f.classList.contains('open')); };
function closeFlyout() { $('#flyout').classList.remove('open'); $('#tray').classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('#flyout')) closeFlyout(); });

/* ---------- scenes ---------- */
function setScene(name) {
  cancelFlow(true);
  scene = name; S = { ...SCENES[name] };
  document.querySelectorAll('[data-sc]').forEach(b => b.classList.toggle('on', b.dataset.sc === name));
  $('#notif').classList.remove('show');
  rendered = false; render();
  if (name === 'revoked') setTimeout(() => scene === 'revoked' && S.ax === 'revoked' && $('#notif').classList.add('show'), 900);
}
document.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => setScene(b.dataset.sc));
$('#notif').onclick = () => { $('#notif').classList.remove('show'); axFlow('toggle'); };

/* ---------- Bluetooth: the system's own prompt ---------- */
async function btFlow() {
  S.bt = 'waiting'; render();
  const ph = $('#ph'), win = $('#win').getBoundingClientRect();
  ph.style.left = (win.left + win.width / 2 - 145) + 'px';
  ph.style.top = (win.top + 120) + 'px';
  ph.innerHTML = `<em>这里是 macOS 的系统弹窗（示意，不画系统界面）</em>
    "Yaozhi"想要使用蓝牙。<br>用途说明：遥指需要蓝牙来连接遥控器并接收语音。
    <div class="bs"><button data-a="no">不允许</button><button data-a="yes">允许</button></div>`;
  ph.classList.add('open');
  ph.querySelectorAll('button').forEach(b => b.onclick = () => {
    ph.classList.remove('open');
    if (b.dataset.a === 'yes') { S.bt = 'granted'; fresh.add('bt'); render(); islandSuccess('蓝牙已允许，遥控器已连接'); }
    else { S.bt = 'denied'; render(); }
  });
}

/* ---------- Accessibility (and denied Bluetooth): System Settings + drag panel ---------- */
let flow = null; // { mode, perm, prev }
const SYSAPPS = [
  { n: 'Typeless', c: 'linear-gradient(145deg,#222,#555)', on: true },
  { n: '终端', c: 'linear-gradient(145deg,#2b2b2b,#111)', on: true },
];

function placeSys() {
  const sys = $('#sys'), g = $('#guide');
  const W = innerWidth, H = innerHeight, sw = Math.min(560, W * 0.46);
  sys.style.width = sw + 'px';
  const left = W - sw - Math.max(24, W * 0.05), top = Math.max(60, H * 0.12);
  sys.style.left = left + 'px'; sys.style.top = top + 'px';
  g.style.left = (left + 170) + 'px'; g.style.width = (sw - 170) + 'px';
  g.style.top = (top + sys.offsetHeight + 8) + 'px';
  const win = $('#win');
  const wr = win.offsetWidth * 0.9, wl = W / 2 - wr / 2;
  const shift = Math.max(0, wl + wr - (left - 30));
  win.style.setProperty('--shift', Math.min(shift, wl - 16) + 'px');
}

function sysList(mode) {
  const list = $('#syslist');
  list.innerHTML = '';
  const apps = SYSAPPS.map(a => ({ ...a }));
  if (mode === 'toggle') apps.push({ n: 'Yaozhi', mine: true, on: false });
  if (mode === 'stale') apps.push({ n: 'Yaozhi', mine: true, on: true, old: true });
  apps.forEach(a => list.appendChild(sysRow(a)));
  const pm = document.createElement('div');
  pm.className = 'pm';
  pm.innerHTML = '<button id="pplus" title="添加">+</button><button id="pminus" title="移除">−</button>';
  list.appendChild(pm);
  $('#pminus').onclick = removeSelected;
  $('#pplus').onclick = () => grant('plus');
}
function sysRow(a) {
  const r = document.createElement('div');
  r.className = 'app';
  r.innerHTML = `<i class="ai" style="background:${a.mine ? 'linear-gradient(145deg,#5b8cff,#a46bff)' : a.c}"></i><span class="nm">${a.n}</span><i class="tog ${a.on ? 'on' : ''}"></i>`;
  if (a.mine) r.dataset.mine = a.old ? 'old' : 'cur';
  r.onclick = e => {
    if (e.target.classList.contains('tog')) {
      if (r.dataset.mine === 'cur' && !e.target.classList.contains('on')) grant('toggle', e.target);
      return;
    }
    document.querySelectorAll('.sys .app').forEach(x => x.classList.remove('sel'));
    r.classList.add('sel');
    if (r.dataset.mine === 'old') $('#pminus').classList.add('hint');
  };
  return r;
}

function guideBody() {
  const perm = flow && flow.perm === 'bt' ? 'Bluetooth' : 'Accessibility';
  return `<div class="gtxt">Drag <b>Yaozhi</b> to the list above to allow <b>${perm}</b>.</div>
    <div class="gtile" id="gtile"><div class="appicon">${IC.remote}</div><span class="nm">Yaozhi</span>
      <span class="dh">${IC.hand}Drag</span></div>`;
}

async function axFlow(mode, perm = 'ax') {
  if (flowBusy) return;
  closeFlyout(); $('#notif').classList.remove('show');
  flow = { mode, perm, prev: S[perm] };
  S[perm] = 'waiting'; render();
  placeSys(); sysList(mode);
  if (perm === 'bt') $('#sys .nav').innerHTML = '‹ <span>隐私与安全性</span> 蓝牙';
  else $('#sys .nav').innerHTML = '‹ <span>隐私与安全性</span> 辅助功能';
  $('#win').classList.add('aside');
  await sleep(reduce ? 0 : 250);
  $('#sys').classList.add('open');
  await sleep(reduce ? 0 : 350);
  setGuide(mode);
}
function setGuide(mode) {
  flow.mode = mode;
  $('#gbody').innerHTML = guideBody();
  placeSys();
  $('#guide').classList.add('open');
  bindDrag($('#gtile'));
  if (mode === 'toggle') pulseMine();
  render();
}
function pulseMine() {
  const t = document.querySelector('.sys .app[data-mine="cur"] .tog');
  if (t) t.animate([{ boxShadow: '0 0 0 0 rgba(91,140,255,.0)' }, { boxShadow: '0 0 0 5px rgba(91,140,255,.45)' }, { boxShadow: '0 0 0 0 rgba(91,140,255,0)' }], { duration: 1400, iterations: 3 });
}
function removeSelected() {
  const sel = document.querySelector('.sys .app.sel');
  if (!sel || !sel.dataset.mine) return;
  $('#pminus').classList.remove('hint');
  sel.classList.add('gone');
  setTimeout(() => { sel.remove(); if (flow) setGuide('add'); }, 360);
}

/* drag the tile into the list */
function bindDrag(tile) {
  tile.onpointerdown = e => {
    e.preventDefault();
    const ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.innerHTML = `<div class="appicon" style="width:26px;height:26px">${IC.remote}</div><b>Yaozhi</b>`;
    document.body.appendChild(ghost);
    const list = $('#syslist');
    const move = ev => {
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      const r = list.getBoundingClientRect();
      list.classList.toggle('hot', ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom);
    };
    move(e);
    const up = ev => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up);
      const hot = list.classList.contains('hot');
      list.classList.remove('hot'); ghost.remove();
      if (hot) grant('drop');
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up);
  };
}

function stopHint() {}

/* the system authenticates, then the switch turns on */
async function grant(how, tog) {
  if (!flow || flowBusy) return;
  if (how === 'plus' && flow.mode !== 'add') return;
  flowBusy = true; stopHint();
  const sys = $('#sys').getBoundingClientRect(), ph = $('#ph');
  ph.style.left = (sys.left + sys.width / 2 - 145) + 'px';
  ph.style.top = (sys.top + 110) + 'px';
  ph.innerHTML = how === 'plus'
    ? '<em>系统的文件选择窗口（示意）</em>选择"应用程序"里的 Yaozhi.app → 打开<br>然后系统要求验证身份（触控 ID 或密码）'
    : '<em>系统的身份验证（示意）</em>系统设置要求验证身份：触控 ID 或输入密码';
  ph.classList.add('open');
  await sleep(1300);
  ph.classList.remove('open');
  if (how !== 'toggle') {
    const list = $('#syslist'), row = sysRow({ n: 'Yaozhi', mine: true, on: false });
    row.classList.add('new');
    list.insertBefore(row, list.querySelector('.pm'));
    tog = row.querySelector('.tog');
    await sleep(250);
  }
  tog.classList.add('on');
  // Yaozhi polls (MyGo permissionflow: every 250 ms); Guide returns and the panel closes.
  await sleep(300);
  finishFlow(true);
}

async function finishFlow(ok) {
  const perm = flow ? flow.perm : 'ax';
  $('#guide').classList.remove('open');
  stopHint();
  await sleep(reduce ? 0 : 200);
  $('#sys').classList.remove('open');
  $('#win').classList.remove('aside');
  if (ok) { S[perm] = 'granted'; fresh.add(perm); }
  flow = null; flowBusy = false;
  render();
  if (ok) islandSuccess(perm === 'bt' ? '蓝牙已允许' : '辅助功能已允许，可以说话了');
}
function cancelFlow(silent) {
  if (S.bt === 'waiting' && !flow) { S.bt = 'missing'; $('#ph').classList.remove('open'); }
  if (flow) { S[flow.perm] = flow.prev; flow = null; }
  flowBusy = false; stopHint();
  $('#guide').classList.remove('open'); $('#sys').classList.remove('open'); $('#win').classList.remove('aside'); $('#ph').classList.remove('open');
  if (S.tl === 'testing') S.tl = 'unconfirmed';
  $('#win').classList.remove('listening');
  if (silent !== true) render();
}
$('#gx').onclick = () => cancelFlow();

/* ---------- "say something" end-to-end check ---------- */
async function testFlow() {
  if (blocking().length) return;
  S.tl = 'testing'; render();
  await sleep(1100);
  if (S.tl !== 'testing') return;
  $('#win').classList.add('listening');
  islandLock = true;
  setIsland('wait', '<span class="wave"><i></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.45s"></i></span>', '正在听<small>松开语音键结束</small>');
  await sleep(2200);
  $('#win').classList.remove('listening');
  setIsland('wait', '<i class="spin"></i>', '等 Typeless 出字…');
  await sleep(1100);
  islandLock = false;
  if (S.tl !== 'testing') return;
  S.tl = 'ok'; fresh.add('tl'); render();
  islandSuccess('Typeless 出字了，一切就绪');
}

/* ---------- theme ---------- */
function setTheme(light) { document.body.classList.toggle('light', light); $('#theme').textContent = light ? '深色' : '浅色'; }
$('#theme').onclick = () => setTheme(!document.body.classList.contains('light'));
setTheme(matchMedia('(prefers-color-scheme: light)').matches);

setScene('first');
placeSys();
</script>
